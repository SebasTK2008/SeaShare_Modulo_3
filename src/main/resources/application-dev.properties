# Perfil de desarrollo local: defaults para la infraestructura de docker-compose en localhost.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seashare}
spring.datasource.username=${DB_USERNAME:seashare}
spring.datasource.password=${DB_PASSWORD:seashare}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:seashare}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:seashare}

management.endpoints.web.exposure.include=health,info,metrics,prometheus

seashare.fleet.base-url=${FLEET_BASE_URL:http://localhost:8081}

# Pasarela: por defecto el simulador local (gateway-stub, docker compose; Modo A de QA): offline y sin
# credenciales. Para Mercado Pago sandbox se activa el perfil adicional "sandbox" (dev,sandbox).
seashare.gateway.base-url=${GATEWAY_BASE_URL:http://localhost:8082}
seashare.gateway.access-token=${GATEWAY_ACCESS_TOKEN:}
seashare.gateway.webhook-secret=${GATEWAY_WEBHOOK_SECRET:dev-webhook-secret}
seashare.gateway.settlement-mode=${GATEWAY_SETTLEMENT_MODE:simulated}
