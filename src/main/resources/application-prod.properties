# Perfil de producción: sin defaults para credenciales, URLs de entorno ni secretos (fallo ruidoso
# si falta una variable). Se activa con SPRING_PROFILES_ACTIVE=prod y los valores se aportan por
# entorno (variables de entorno o Docker secrets).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Sin seguridad (D-21): exposición mínima de Actuator; prometheus solo con red interna
# (sobreescribible con MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE).
management.endpoints.web.exposure.include=health,info

seashare.fleet.base-url=${FLEET_BASE_URL}
seashare.gateway.base-url=${GATEWAY_BASE_URL}
seashare.gateway.access-token=${GATEWAY_ACCESS_TOKEN}
seashare.gateway.webhook-secret=${GATEWAY_WEBHOOK_SECRET}
