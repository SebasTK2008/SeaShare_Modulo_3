# Perfil QA: agrega el seed repetible de datos base compartidos.
# Se activa junto con `dev` (SPRING_PROFILES_ACTIVE=dev,qa) y NO debe usarse en prod.
# El seed vive en classpath:db/qa y solo inserta `financial_parameters` v1..v7.
# Los datos específicos de cada TC (reservas, intenciones, registros) no se siembran.
spring.flyway.locations=classpath:db/migration,classpath:db/qa
