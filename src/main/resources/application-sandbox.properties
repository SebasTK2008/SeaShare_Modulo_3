# Perfil de integracion con Mercado Pago sandbox (Modo B de QA; docs/qa/runbook-sandbox-mercadopago.md).
# Se activa JUNTO con dev: SPRING_PROFILES_ACTIVE=dev,sandbox. dev aporta la base de datos, RabbitMQ y
# Flota; este perfil sobrescribe solo la pasarela. No define secretos: los aporta el entorno, y sin
# access token ni secreto del webhook la aplicacion no arranca.
seashare.gateway.base-url=${GATEWAY_BASE_URL:https://api.mercadopago.com}
seashare.gateway.access-token=${GATEWAY_ACCESS_TOKEN}
seashare.gateway.webhook-secret=${GATEWAY_WEBHOOK_SECRET}
seashare.gateway.settlement-mode=${GATEWAY_SETTLEMENT_MODE:simulated}
seashare.gateway.credentials-required=true
