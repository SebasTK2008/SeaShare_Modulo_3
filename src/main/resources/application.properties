spring.application.name=seashare-m3

# Perfil por defecto para desarrollo local; en producción se exige SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.locations=classpath:db/migration

# Jackson 3: fechas e instantes en ISO-8601; la feature se fija en JacksonConfig porque Boot 4 ya no
# expone spring.jackson.serialization para DateTimeFeature (write-dates-as-timestamps ya no existe)
spring.jackson.property-naming-strategy=SNAKE_CASE

management.endpoint.health.probes.enabled=true

# OpenAPI / Swagger UI: disponible en desarrollo y QA; desactivado en prod (D-21).
info.app.version=@project.version@
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/v1/**
springdoc.packages-to-scan=com.seashare.seasharem3.infrastructure.adapter.in.web,com.seashare.seasharem3.infrastructure.adapter.in.webhook
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
# Boot 4 renombró max-attempts → max-retries y Spring Framework 7 cuenta reintentos DESPUÉS del primer
# intento (total = 1 + max-retries): 4 produce los 5 intentos con backoff de general-plan §7.2 y
# contracts/README §4.4. No subir a 5 sin cambiar el contrato.
spring.rabbitmq.listener.simple.retry.max-retries=4
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=16s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

seashare.timezone=${SEASHARE_TIMEZONE:America/Bogota}
seashare.estimates.max-batch-size=50
seashare.reporting.max-page-size=100
seashare.outbox.relay-interval=5s
seashare.outbox.batch-size=100
# La URL de Flota no tiene default aquí: dev usa el mock local (application-dev.properties) y
# prod exige FLEET_BASE_URL sin default (application-prod.properties).
seashare.fleet.connect-timeout=1s
seashare.fleet.read-timeout=1s
seashare.fleet.retry.max-attempts=2
seashare.fleet.retry.wait-duration=100ms
seashare.fleet.circuit-breaker.failure-rate-threshold=50
seashare.fleet.circuit-breaker.minimum-number-of-calls=5
seashare.fleet.circuit-breaker.sliding-window-size=10
seashare.fleet.circuit-breaker.wait-duration-in-open-state=10s
seashare.fleet.circuit-breaker.permitted-number-of-calls-in-half-open-state=1
seashare.gateway.read-timeout=10s
seashare.gateway.connect-timeout=10s
seashare.gateway.settlement-mode=${GATEWAY_SETTLEMENT_MODE:simulated}
seashare.gateway.reconciliation-interval=5m
seashare.gateway.circuit-breaker.failure-rate-threshold=50
seashare.gateway.circuit-breaker.minimum-number-of-calls=5
seashare.gateway.circuit-breaker.sliding-window-size=10
seashare.gateway.circuit-breaker.wait-duration-in-open-state=10s
seashare.gateway.circuit-breaker.permitted-number-of-calls-in-half-open-state=1

logging.pattern.level=%5p [%X{correlationId:-}]
