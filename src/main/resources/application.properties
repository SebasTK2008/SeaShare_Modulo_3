spring.application.name=seashare-m3

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seashare}
spring.datasource.username=${DB_USERNAME:seashare}
spring.datasource.password=${DB_PASSWORD:seashare}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.locations=classpath:db/migration

# Jackson 3: fechas e instantes en ISO-8601; la feature se fija en JacksonConfig porque Boot 4 ya no
# expone spring.jackson.serialization para DateTimeFeature (write-dates-as-timestamps ya no existe)
spring.jackson.property-naming-strategy=SNAKE_CASE

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:seashare}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:seashare}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=5
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=16s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

seashare.timezone=${SEASHARE_TIMEZONE:America/Bogota}
seashare.estimates.max-batch-size=50
seashare.reporting.max-page-size=100
seashare.outbox.relay-interval=5s
seashare.outbox.batch-size=100
seashare.fleet.base-url=${FLEET_BASE_URL:http://localhost:8081}
seashare.fleet.connect-timeout=1s
seashare.fleet.read-timeout=1s
seashare.gateway.base-url=${GATEWAY_BASE_URL:https://api.mercadopago.com}
seashare.gateway.access-token=${GATEWAY_ACCESS_TOKEN:}
seashare.gateway.read-timeout=10s
seashare.gateway.connect-timeout=10s
seashare.gateway.webhook-secret=${GATEWAY_WEBHOOK_SECRET:}

logging.pattern.level=%5p [%X{correlationId:-}]
