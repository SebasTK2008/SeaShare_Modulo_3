services:
  postgres:
    image: postgres:16
    container_name: seashare-postgres
    environment:
      POSTGRES_DB: seashare
      POSTGRES_USER: seashare
      POSTGRES_PASSWORD: seashare
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seashare -d seashare"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: seashare-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: seashare
      RABBITMQ_DEFAULT_PASS: seashare
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres-data:
